<style>
html, body {
display: flex;
align-items: center;
justify-content: center;
flex-direction: column;
margin: 0;
padding: 0;
height: 100vh;
}
* { text-align: center; }
:root { color-scheme: light dark; }
</style>
<video id="prv" style="flex-grow:1;width:100%"></video><br>
<button id="cont" style="width:50px;height:50px;border-radius:25px;user-select:none"></button><br>
<script>
let stream;
let rec;
let chunks=[];
let initialized=false;
async function init(){if(initialized)return;
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",frameRate:{ideal:120}}});
prv.srcObject = stream;
await prv.play();
rec=new MediaRecorder(stream);
rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
rec.onstop=()=>{const blob=new Blob(chunks,{type:"video/webm"});
chunks=[];const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="recording.webm";a.click();URL.revokeObjectURL(url);};
initialized = true;}
cont.onpointerdown=async()=>{await init();if(rec.state==="inactive"){chunks=[];rec.start();}};
cont.onpointerup=()=>{if(rec&&rec.state==="recording"){rec.stop();}};
</script>
